[package]
name = "ts2"
version = "0.1.0"
edition = "2024"
description = "Clean-room Rust reimplementation of Toy Story 2 (PC, 1999) that loads assets from a user's own install"
publish = false
build = "build.rs"

# OpenTS2: the engine stays this root crate for now; the launcher (and later the editor
# and modding crates) live under crates/. See docs/opents2-design.md.
[workspace]
members = [".", "crates/launcher"]
default-members = [".", "crates/launcher"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "ts2-tool"
path = "src/bin/ts2-tool.rs"

[[bin]]
name = "ts2-viewer"
path = "src/bin/ts2-viewer.rs"

[dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
glam = "0.29"
oxideav-mpeg12video = "0.0.13"
pollster = "0.4"
rodio = { version = "0.19", default-features = false }
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.6.1", default-features = false, features = ["mp2"] }
toml = "0.8"
wgpu = "24.0"
winit = "0.30"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
