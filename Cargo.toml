[package]
name = "ts2"
version = "0.1.0"
edition = "2024"
description = "Clean-room Rust reimplementation of Toy Story 2 (PC, 1999) that loads assets from a user's own install"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "ts2-tool"
path = "src/bin/ts2-tool.rs"

[[bin]]
name = "ts2-viewer"
path = "src/bin/ts2-viewer.rs"

[dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
glam = "0.29"
pollster = "0.4"
rodio = { version = "0.19", default-features = false }
wgpu = "24.0"
winit = "0.30"
