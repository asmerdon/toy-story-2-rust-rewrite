id = "play-as-woody"
name = "Play as Woody"
version = "0.1.0"
authors = ["lewiloon2k"]
description = "Run through any level as Woody, using Buzz's moves."
engine = "0.1"

[play_as]
creature = "WOODY"
model = "data/level05/level1.ngn"
animation = "retarget"
scale = 1.0
laser = false

# [creature node, Buzz node]: the automatic map puts the torso on Buzz's pelvis and doubles
# up the arms, so the torso and both arm chains are named here.
map = [[0, 13], [5, 8], [2, 9], [3, 10], [10, 14], [7, 15], [8, 16]]

# Each part hangs off its parent at a joint (Woody's own rest pose, model units), so his longer
# arms can't come apart from his body when Buzz's moves swing them. Thighs follow Buzz's thighs.
joints = [
    { node = 1, parent = 0, at = [-11.0, -390.0, 0.0] },   # neck
    { node = 5, parent = 0, at = [42.0, -355.0, 5.0] },    # shoulders
    { node = 10, parent = 0, at = [-42.0, -355.0, 5.0] },
    { node = 2, parent = 5, at = [110.0, -358.0, 3.0] },   # elbows
    { node = 7, parent = 10, at = [-110.0, -358.0, 3.0] },
    { node = 3, parent = 2, at = [174.0, -300.0, -3.0] },  # wrists
    { node = 8, parent = 7, at = [-174.0, -300.0, -3.0] },
    { node = 4, parent = 6, at = [37.0, -153.0, -5.0] },   # knees
    { node = 9, parent = 11, at = [-37.0, -153.0, -5.0] },
]

# Woody's rest pose holds his arms out; Buzz's hang down. Swing each arm chain down about its shoulder (60 degrees leaves them a little out from his sides; 80 put his hands together in front).
[[play_as.rest]]
nodes = [5, 2, 3]
pivot = [42.0, -355.0, 5.0]
angles = [0.0, 0.0, 60.0]

[[play_as.rest]]
nodes = [10, 7, 8]
pivot = [-42.0, -355.0, 5.0]
angles = [0.0, 0.0, -60.0]
