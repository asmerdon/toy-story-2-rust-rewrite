id = "play-as-zurg-robot"
name = "Play as a Zurg robot"
version = "0.1.0"
authors = ["lewiloon2k"]
description = "Bounce through any level as one of Zurg's spring robots: hold a direction to hop."
engine = "0.1"

[play_as]
creature = "ZURG1"
